<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>maze-dash</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A one-button maze runner: the runner never stops and you only choose which way it turns. Sixty-second runs, procedural mazes, records kept in your browser.">
<style>
  :root {
    --paper: #faf8f4;
    --ink: #1b1b1b;
    --accent: #b0430c; /* 5.4:1 on paper */
  }
  * { box-sizing: border-box; }
  /* The boot guard hides #hud and #act to take away affordances that would be
     lies after a failed boot. Any element with its own `display` rule beats
     the UA sheet's `[hidden] { display: none }` on specificity, so `hidden`
     silently did nothing to #hud (display: flex) and the dead HUD kept
     counting "60.0 s left" above the failure sentence. One rule, applied to
     every element, so the next `display` rule added to this file cannot
     re-open the hole. */
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 10px 12px 12px;
    /* no double-tap zoom, no text selection while mashing the button */
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    width: 100%;
    max-width: 40rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  h1 {
    margin: 0;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: lowercase;
  }
  #hud, #best {
    margin: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.85rem;
  }
  /* Mazes cleared is the score, so it is the largest thing on the page and
     the clock is the footnote — the other way round is how the one number
     that matters ended up in peripheral vision. */
  #hud { display: flex; align-items: baseline; gap: 0.34em; }
  #cleared {
    font-size: 1.7rem;
    font-weight: 600;
    line-height: 1;
    transition: color 120ms ease-out;
  }
  #cleared.bump { color: var(--accent); }   /* one beat, in place, on a clear */
  /* At 180px the HUD wraps, and without this it wrapped *inside* the unit and
     left the word "left" alone on a line of its own. */
  #hud .unit { font-size: 0.7rem; letter-spacing: 0.06em; opacity: 0.7; white-space: nowrap; }
  #hud .dot { opacity: 0.35; }
  #best { opacity: 0.72; min-height: 1.15em; }
  #hint {
    margin: 0;
    font-size: 0.78rem;
    line-height: 1.35;
    opacity: 0.72;
    text-align: center;
    max-width: 24rem;
  }
  #wrap { position: relative; width: 100%; display: flex; justify-content: center; }
  canvas {
    display: block;
    max-width: 100%;
    /* Only the width is ever set from script. The height comes from the
       intrinsic ratio of the backing store, so if max-width clamps the width
       the height follows it and the board cannot end up 176x184. */
    height: auto;
    touch-action: none;
  }
  /* A short landscape window has no height to spare and a great deal of width.
     Stack the chrome beside the board instead of above and below it, or the
     maze gets a fifth of the screen and 71% of the width sits empty. */
  @media (orientation: landscape) and (max-height: 520px) {
    main {
      display: grid;
      grid-template-columns: auto auto;
      justify-content: center;
      align-content: center;
      justify-items: center;
      column-gap: 20px;
      row-gap: 6px;
      max-width: none;
    }
    #wrap { grid-area: 1 / 1 / 6 / 2; width: auto; align-self: center; }
    h1    { grid-area: 1 / 2; }
    #hud  { grid-area: 2 / 2; }
    #act  { grid-area: 3 / 2; }
    #best { grid-area: 4 / 2; }
    #hint { grid-area: 5 / 2; max-width: 13rem; }
  }
  #overlay {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    height: 100%;
    /* One column, and no gap. Flex sized each card to its own sentence, so the
       results screen showed two cards 61px apart in width with 0.6em of board
       between them — enough to frame a stray wall stub, paper above it and
       paper below. Grid gives them one shared column, sized by fit-content to
       the wider card and to no more than the overlay itself at 360px, which is
       where flex used to shrink to; both cards stretch to that column. With
       the gap closed the pair is one unbroken sheet. */
    display: grid;
    grid-template-columns: fit-content(100%);
    align-content: center;
    justify-content: center;
    padding: 1rem;
    text-align: center;
    /* Thin enough to read the maze through: at 0.93 the board behind was
       1.14:1 and the cold load looked like a blank card. */
    background: rgba(250, 248, 244, 0.55);
    touch-action: none;
  }
  /* The scrim stays thin so the board still reads as a maze on a cold load,
     which means wall strokes at 12:1 run straight through the glyphs. A blur
     halo does not survive that — it softens the stroke where it crosses a
     letter instead of removing it. Each line gets its own near-opaque paper
     card sized to the text, so the copy sits on paper and the board is still
     visible around it. */
  #overlay > div {
    background: rgba(250, 248, 244, 0.94);
    padding: 0.28em 0.62em;
    border-radius: 3px;
  }
  #overlay .big {
    font-size: 1.35rem;
    letter-spacing: 0.14em;
    text-transform: lowercase;
  }
  #overlay .big.new { color: var(--accent); }
  #overlay .sub { font-size: 0.85rem; line-height: 1.4; max-width: 20rem; }
  #act {
    font: inherit;
    font-size: 0.95rem;
    min-height: 44px;
    padding: 0 1.6rem;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 90ms linear;
  }
  /* -webkit-tap-highlight-color is off, so the press feedback has to be ours.
     On a phone this button is the whole UI. */
  #act:hover { background: rgba(27, 27, 27, 0.05); }
  #act:active { background: rgba(27, 27, 27, 0.14); }
  #act:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
<main>
  <h1>maze-dash</h1>
  <p id="hud" aria-hidden="false"><span id="cleared">0</span> <span class="unit">cleared</span> <span class="dot">·</span> <span id="time">60.0</span> <span class="unit">s left</span></p>
  <div id="wrap">
    <canvas id="stage" aria-hidden="true"></canvas>
    <div id="overlay"></div>
  </div>
  <button id="act" type="button">Start run</button>
  <p id="best"></p>
  <p id="hint">Space, Enter, or tap: move the arrow to the next exit.</p>
  <div id="live" role="status" aria-live="polite" class="sr-only"></div>
</main>
<script>
// maze-dash — the whole program. One file, no dependencies, no build step.
// Everything is inside this try/catch: a throw at boot must degrade to a
// sentence, never to a blank page.

// The nodes the failure path needs, resolved before the guarded block starts.
// document.getElementById is part of the failure surface too, and when it was
// the thing that threw, the recovery path's own lookups threw with it: the
// second throw landed in the inner catch and the page kept a frozen HUD and a
// Start button that did nothing, with no sentence saying why. Each node is
// resolved here through two independent APIs, so a break in either one still
// leaves the catch below reading variables it already holds.
function bootNode(id) {
  try { var el = document.getElementById(id); if (el) return el; } catch (e) { /* fall through */ }
  try { return document.querySelector('#' + id); } catch (e) { return null; }
}
// One statement of the recovery below, run on its own. A null node or a
// poisoned DOM method takes down this step and nothing after it: the recovery
// is a list of independent repairs, not a chain where the first throw ends it.
function bootStep(fn) {
  try { fn(); return true; } catch (e) { return false; }
}
var bootOverlay = bootNode('overlay'), bootAct = bootNode('act'),
    bootHud = bootNode('hud'), bootHint = bootNode('hint');
try {
(function () {
  'use strict';

  var COLS = 13, ROWS = 13;      // fixed for every maze in every run
  var WALL = 2;                  // wall stroke width, in CSS pixels
  var GAP = 8;                   // the flex row-gap in main, in CSS pixels
  var PAD = 22;                  // body padding, top + bottom
  var CELL = 24;                 // set by layoutIfNeeded()

  var PAPER = '#faf8f4', INK = '#1b1b1b', ACCENT = '#b0430c';

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var wrap = document.getElementById('wrap');
  var h1El = document.querySelector('h1');
  var hudEl = document.getElementById('hud');
  var overlay = document.getElementById('overlay');
  var actBtn = document.getElementById('act');
  var timeEl = document.getElementById('time');
  var clearedEl = document.getElementById('cleared');
  var bestEl = document.getElementById('best');
  var hintEl = document.getElementById('hint');
  var liveEl = document.getElementById('live');

  var reduceMotion = false;
  try {
    reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  } catch (e) { reduceMotion = false; }

  // ---- canvas sizing -------------------------------------------------
  // A devicePixelRatio change at constant CSS size must take the resize path,
  // so dpr is a first-class key in the comparison below.
  var lastW = -1, lastDpr = -1;
  var sideCols = null;
  try { sideCols = window.matchMedia('(orientation: landscape) and (max-height: 520px)'); }
  catch (e) { sideCols = null; }

  // Two surfaces, and which sentence goes on which one is decided by height,
  // not by taste. #hint sits in chromePx(), so every line it wraps to comes
  // out of the board. #overlay does not: it is position:absolute inside
  // #wrap, its content never feeds hintPx(), and it costs zero board pixels
  // at any viewport. So the hint carries the control — the one thing that is
  // true on all three screens and has to be readable while playing — and the
  // strategy, which is longer than any height budget here can hold, goes on
  // an overlay card where length is free.
  //
  // Cramming control, rule and trap into this one line is what broke twice.
  // A sentence squeezed into a height budget stops saying which way is
  // "right": "keep to the exit nearest your right" is second person, so to a
  // stranger the right is the reader's, which is screen-right — the runner is
  // drawn as one orientation-free arc() and nothing on the board offers its
  // frame instead. Measured below, that reading is the worst of the four
  // policies in the table, worse even than never pressing at all.
  //
  // This string is byte-identical to 805f36c's `running` hint, and that is
  // deliberate: 805f36c reserved the tallest of three sentences, and this one
  // was the tallest at every width, so a single hint of exactly this text
  // makes hintPx() return the same reserve base did. Swept against 805f36c's
  // reserve over widths 170 to 1400 in steps of 10 — 124 widths — with
  // #hint.offsetHeight compared against max(offsetHeight) over base's three
  // sentences: 0 widths taller, 0 widths shorter. Rewording this is a layout
  // change; re-run that sweep, do not eyeball it.
  var HINT = 'Space, Enter, or tap: move the arrow to the next exit.';

  // The strategy. It lives on the overlay because it does not fit here, and
  // it names its frame of reference twice — "the runner's right", "as it
  // arrives" — because the frame is the whole defect: the runner is one arc()
  // with no facing, so nothing on the board supplies a frame and the copy has
  // to. The heading it arrives with is on screen either way: the dashed
  // tether's last segment when the junction is more than one cell off, and
  // the runner's own motion when it is not.
  //
  // The fallback stops at straight on purpose. "else left" was measured, not
  // assumed, and it never fires: a junction offers at least two of {straight,
  // right, left}, so if right is shut straight is open. 0 of 18,539 junction
  // arrivals sampled across the 300 bot runs below had neither.
  //
  // That this is the rule that pays is measured too. Protocol, because three
  // harnesses disagreed until they matched it: one fresh page per run with
  // Math.random replaced by mulberry32 and the seed installed in an init
  // script that runs *before* the page's own script, so the maze drawn at
  // load consumes the same stream a real first run does. Reusing a page and
  // reseeding after boot returns 0.750 to 0.883 for hands-off instead of the
  // 1.050 below. Virtual rAF clock stepped at a fixed 16.667ms; policy
  // applied through the real keydown handler; seeds 1000-1059, one 60-second
  // run per seed, n = 60 runs per policy:
  //
  //   this card's rule, read literally   1.833 mazes/run    0 of 60 scoreless
  //   hands-off, never pressing          1.050 mazes/run   19 of 60 scoreless
  //   the reader's right = screen-east   0.217 mazes/run   48 of 60 scoreless
  //   straight at the ring               0.150 mazes/run   51 of 60 scoreless
  //
  // The rule is the only one of the four that never scores zero, which is the
  // point: a perfect maze is a tree, so one wall runs past every cell. The
  // last two are the controls — a harness that does not put both of them
  // below hands-off is measuring the wrong thing — and the third row is what
  // the line shipped at cb9f00c actually told a stranger to do. Issue #45's
  // day-013 table (2.60 / 1.00 / 0.72, real keys at human cadence) is a
  // different measurement of the same ordering, not this one; do not quote
  // its figures as if they came from here.
  var RULE = "At each junction take the exit on the runner's right as it arrives, or the one ahead if there is none. Steering straight for the ring dead-ends.";

  // With one sentence there is nothing to reserve: the hint's height is just
  // this element's height, and it cannot change without the width changing.
  function hintPx() { return hintEl.offsetHeight; }

  // Everything the board is not. Measured rather than assumed: a hard-coded
  // budget does not follow the h1, HUD, button and hint when the page is
  // zoomed, and it was the reason 200% zoom made the playfield *smaller*.
  //
  // #hint is not the only height in here that depends on which screen is up,
  // and an earlier version of this file said it was. bestEl is in this list
  // too, and syncBestLine() blanks it on the results of a run that beat both
  // halves of the record; narrow enough, a real record wraps to two lines, so
  // #best.offsetHeight goes 32 to 16 and the board grows a cell between the
  // ready screen and that results screen. Measured after the syncBestLine fix
  // with a stored record of 2 mazes / 6.00s and a 5-maze / 2.50s run, widths
  // {180, 200, 220, 240, 260} x heights {320, 360, 400, 440, 480, 520, 560,
  // 600, 640, 700}: 5 of those 50 pairs move (200x360, 220x360, 220x400,
  // 240x360, 240x400), all of them upward, all of them 180-260px wide. The
  // same probe on the results of a run that beat only one half moves 0 of 50,
  // and at c24e510 — where either half blanked the line — it moved 5 of 50 in
  // each of those two cases as well. Pre-existing in 805f36c and not fixed
  // here; recorded so the claim in this file is the one the pixels support.
  // Which pairs move depends on how wide the stored record renders, so quote
  // the record with the count.
  function chromePx() {
    if (sideCols && sideCols.matches) return PAD;   // it is beside the board, not above it
    var els = [h1El, hudEl, actBtn, bestEl];
    var h = hintPx();
    for (var i = 0; i < els.length; i++) h += els[i] ? els[i].offsetHeight : 0;
    return h + GAP * (els.length + 1) + PAD;
  }

  function layoutIfNeeded() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var side = !!(sideCols && sideCols.matches);
    var availW = side ? window.innerWidth - hintEl.offsetWidth - 60 : wrap.clientWidth;
    var availH = window.innerHeight - chromePx();
    var avail = Math.max(150, Math.min(availW, availH));
    var cell = Math.max(11, Math.min(44, Math.floor((avail - WALL) / COLS)));
    var css = cell * COLS + WALL;
    if (css === lastW && dpr === lastDpr) return;
    lastW = css; lastDpr = dpr; CELL = cell;
    canvas.style.width = css + 'px';
    canvas.width = Math.round(css * dpr);
    canvas.height = Math.round(css * dpr);
    overlay.style.width = css + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in CSS pixels everywhere
  }

  function boardPx() { return CELL * COLS + WALL; }

  // ---- maze ----------------------------------------------------------
  // Directions in clockwise order. Bit flags mark *open* passages.
  var N = 0, E = 1, S = 2, W = 3;
  var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
  function bit(d) { return 1 << d; }
  function opposite(d) { return (d + 2) & 3; }
  function idx(x, y) { return y * COLS + x; }
  function cx(i) { return i % COLS; }
  function cy(i) { return (i / COLS) | 0; }
  function randInt(n) { return Math.floor(Math.random() * n); }

  // Iterative randomized depth-first search (recursive backtracker) with an
  // explicit stack. It visits all 169 cells and carves exactly one edge per
  // newly visited cell, so the result is a spanning tree: a perfect maze with
  // exactly one path between any two cells. No solvability check is needed.
  function carve() {
    var cells = new Uint8Array(COLS * ROWS);
    var seen = new Uint8Array(COLS * ROWS);
    var stack = [idx(randInt(COLS), randInt(ROWS))];
    seen[stack[0]] = 1;
    var nbrs = [0, 0, 0, 0];
    while (stack.length) {
      var c = stack[stack.length - 1];
      var x = cx(c), y = cy(c), n = 0;
      for (var d = 0; d < 4; d++) {
        var nx = x + DX[d], ny = y + DY[d];
        if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
        if (seen[idx(nx, ny)]) continue;
        nbrs[n++] = d;
      }
      if (n === 0) { stack.pop(); continue; }
      var pick = nbrs[randInt(n)];
      var next = idx(x + DX[pick], y + DY[pick]);
      cells[c] |= bit(pick);
      cells[next] |= bit(opposite(pick));
      seen[next] = 1;
      stack.push(next);
    }
    return cells;
  }

  var G = {
    state: 'ready',                  // 'ready' | 'running' | 'over'
    timeLeft: 60,
    cleared: 0,
    mazeElapsed: 0,
    fastestThisRun: null,
    overAt: 0,
    maze: null,
    takenAt: null,                   // when each exit of each cell was last taken
    seq: 0,                          // monotonic counter behind takenAt
    start: 0,
    exit: 0,
    runner: { from: 0, to: 0, t: 0, heading: E },
    pending: null,
    trail: [],
    flashAt: -1e9              // when the last clear happened; see drawFlash
  };
  // Kept on purpose, and it is the only line in the file that exists for
  // something other than the player: it is what let three reviewers measure
  // the real mechanic instead of reading the source and believing it, and one
  // of them found a blocker that way. Nothing in the game reads it back.
  window.__mazeDash = G;

  function newMaze() {
    G.maze = carve();
    G.takenAt = new Uint32Array(COLS * ROWS * 4);
    G.seq = 0;
    // Entrance and exit are rendering-only notches in the outer wall: the
    // wall data is untouched and the runner starts inside the start cell.
    G.start = idx(0, randInt(ROWS));
    G.exit = idx(COLS - 1, randInt(ROWS));
  }

  // ---- the runner ----------------------------------------------------
  var SPEED = 5.5;                              // cells per second
  // How far back the trail is drawn. Measured, not guessed: a whole-maze trail
  // scored *worse* than this one for every policy tested, because once most of
  // the board is grey "have I been here" stops discriminating. A window of
  // about seven seconds is what answers the question the player is actually
  // asking at a junction — "did I just come from there". It no longer forks on
  // prefers-reduced-motion either: a static line is not motion, and the ten
  // cells that branch used to allow was under two seconds of memory in a game
  // whose whole skill is memory.
  var TRAIL_MAX = 40;

  function neighbour(c, d) { return idx(cx(c) + DX[d], cy(c) + DY[d]); }

  // Open exits from cell c for a runner that arrived heading h, ordered by
  // turn angle: straight ahead, then right, then left. Reverse is excluded,
  // so index 0 always means "carry on" and a press is an act of will.
  function optionsAt(c, h) {
    var order = [h, (h + 1) & 3, (h + 3) & 3];
    var out = [];
    for (var i = 0; i < 3; i++) if (G.maze[c] & bit(order[i])) out.push(order[i]);
    return out;
  }

  // The default exit at a junction is the one closest to straight ahead that
  // the runner has not already taken out of that cell in this maze; once they
  // have all been taken it is the one taken *longest ago*. Both halves matter.
  // Without the first, the no-input policy is a pure function of (cell,
  // heading), so on a loop-free maze the runner falls into a short cycle and
  // orbits it for the whole run. Without the second, falling back to index 0
  // restores exactly that pure function the moment a junction is exhausted —
  // which every junction is, within about twenty seconds — so every hands-off
  // run ended in a permanent closed loop anyway. Least-recently-taken keeps
  // the walk moving through the whole maze, stays fully deterministic, and the
  // arrow still shows exactly the exit that will be taken.
  function defaultIndex(c, o) {
    var best = 0, bestAt = Infinity;
    for (var i = 0; i < o.length; i++) {
      var at = G.takenAt[c * 4 + o[i]];
      if (at === 0) return i;                       // never taken: closest to straight wins
      if (at < bestAt) { bestAt = at; best = i; }
    }
    return best;
  }

  function pushTrail(c) {
    G.trail.push(c);
    if (G.trail.length > TRAIL_MAX) G.trail.shift();
  }

  // Simulate forward from a fresh commit using forced turns and dead-end
  // reversals only, until the next real junction. The point is that the
  // upcoming junction and its default exit are on screen from the instant the
  // previous one was committed, so the reaction window is the whole corridor.
  function lookahead(c, h) {
    var cur = neighbour(c, h), hd = h, path = [cur];
    for (var i = 0; i < 400; i++) {
      if (cur === G.exit) return null;
      var o = optionsAt(cur, hd);
      if (o.length >= 2) {
        return { cell: cur, arrivalHeading: hd, options: o, selIndex: defaultIndex(cur, o), path: path };
      }
      hd = (o.length === 0) ? opposite(hd) : o[0];
      cur = neighbour(cur, hd);
      path.push(cur);
    }
    return null;                                     // cap hit: no arrow
  }

  // Arrival procedure. Returns true when the cell is the exit; otherwise it
  // commits a new heading and the next cell.
  function arrive(c, h) {
    if (c === G.exit) return true;
    var opts = optionsAt(c, h);
    var p = G.pending;
    var nh;
    if (opts.length === 0) nh = opposite(h);        // dead end: reverse in place
    else if (opts.length === 1) nh = opts[0];       // corridor: forced turn
    else if (p && p.cell === c && p.options.length) nh = p.options[p.selIndex % p.options.length];
    else nh = opts[defaultIndex(c, opts)];          // junction: default exit
    G.takenAt[c * 4 + nh] = ++G.seq;
    var r = G.runner;
    r.heading = nh;
    r.from = c;
    r.to = neighbour(c, nh);
    // The lookahead is recomputed on *every* arrival, which includes each
    // corridor cell between here and the junction the arrow is already on.
    // When it resolves to the same junction approached from the same side it
    // is literally the same question, so the player's answer has to carry
    // forward. Rebuilding it with selIndex 0 silently reverted every press one
    // cell later and made the one button a no-op.
    var np = lookahead(c, nh);
    if (np && p && np.cell === p.cell && np.arrivalHeading === p.arrivalHeading) {
      np.selIndex = p.selIndex;
    }
    G.pending = np;
    return false;
  }

  function resetRunner() {
    var r = G.runner;
    r.from = G.start; r.to = G.start; r.t = 0; r.heading = E;
    G.pending = null;
    G.trail.length = 0;
    pushTrail(G.start);
    // The start cell is treated as entered from outside through the west
    // wall: the same arrival code path, with opposite(E) = W excluded.
    arrive(G.start, E);
  }

  function onCleared() {
    G.cleared++;
    if (G.fastestThisRun === null || G.mazeElapsed < G.fastestThisRun) {
      G.fastestThisRun = G.mazeElapsed;
    }
    G.flashAt = nowMs();             // the board's half of the reward; see drawFlash
    bumpCleared();
    announce('Maze ' + G.cleared + ' cleared.');
    newMaze();
    resetRunner();
    G.mazeElapsed = 0;               // straight on, no pause and no transition
  }

  function stepRunner(dt) {
    var r = G.runner;
    r.t += SPEED * dt;
    var guard = 0;
    while (r.t >= 1 && guard++ < 20) {
      r.t -= 1;
      var landed = r.to;
      pushTrail(landed);
      if (arrive(landed, r.heading)) { onCleared(); break; }
    }
  }

  // ---- drawing -------------------------------------------------------
  function px(x) { return WALL / 2 + x * CELL; }
  function centreX(c) { return px(cx(c)) + CELL / 2; }
  function centreY(c) { return px(cy(c)) + CELL / 2; }

  function runnerX() {
    var r = G.runner;
    return centreX(r.from) + (centreX(r.to) - centreX(r.from)) * r.t;
  }
  function runnerY() {
    var r = G.runner;
    return centreY(r.from) + (centreY(r.to) - centreY(r.from)) * r.t;
  }

  function drawWalls() {
    ctx.strokeStyle = INK;
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = WALL;
    ctx.lineCap = 'round';
    ctx.beginPath();
    var m = G.maze;
    var startY = cy(G.start), exitY = cy(G.exit);
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var c = m[idx(x, y)];
        var left = px(x), top = px(y), right = px(x + 1), bottom = px(y + 1);
        if (!(c & bit(N))) { ctx.moveTo(left, top); ctx.lineTo(right, top); }
        // The entrance is the missing west edge of the start cell.
        if (!(c & bit(W)) && !(x === 0 && y === startY)) {
          ctx.moveTo(left, top); ctx.lineTo(left, bottom);
        }
        if (y === ROWS - 1 && !(c & bit(S))) { ctx.moveTo(left, bottom); ctx.lineTo(right, bottom); }
        // The exit is the missing east edge of the exit cell.
        if (x === COLS - 1 && !(c & bit(E)) && y !== exitY) {
          ctx.moveTo(right, top); ctx.lineTo(right, bottom);
        }
      }
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // A filled core with a ring breathing well clear of it. At phone width the
  // old r=0.28 ring and its r=0.36..0.45 breath were close enough to merge
  // into one fuzzy doughnut, and the goal had no identity of its own.
  function drawExit(now) {
    var c = G.exit;
    var mx = px(cx(c)) + CELL / 2, my = px(cy(c)) + CELL / 2;
    ctx.fillStyle = INK;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(mx, my, Math.max(2, CELL * 0.15), 0, Math.PI * 2);
    ctx.fill();
    var r = reduceMotion ? CELL * 0.4 : CELL * (0.38 + 0.08 * Math.sin(now / 620));
    ctx.strokeStyle = INK;
    ctx.lineWidth = WALL;
    ctx.globalAlpha = 0.45;
    ctx.beginPath();
    ctx.arc(mx, my, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // The other half of the clear beat, put where the eye already is. The
  // #cleared numeral is 308.6px above the board's centre at 1280x800 — about
  // 7.8 degrees of eccentricity, parafoveal, where colour discrimination is
  // already degraded — so the only acknowledgement the game had was outside
  // the place the player was looking, and the board wipe read as a reset.
  // The whole board washes towards the accent instead. Not the old exit ring:
  // the board underneath is already the *next* maze with its ring somewhere
  // else, so amber at a stale location would be a second goal marker for a
  // fifth of a second. A full-board wash is unmistakably not a game object, so
  // it borrows nothing from the accent's "you, and the choice in front of you"
  // rule.
  // 0.14 is the peak, and it is bounded on both sides. Every number below is a
  // rendered pixel, not an intention: sampled with getImageData on a 600x600
  // viewport at dpr 1 (CELL 31, backing store 405x405 = 164,025 px), over the
  // board pixels that are still exactly paper three frames after the wash has
  // gone, read on the clearing frame itself — the frame where drawFlash
  // clamps a negative age to full strength. That set is nearly the whole
  // board rather than a corner of it, and its size moves with the maze, so
  // here is what it was counted over: seeds 1000-1011, one forced clear each,
  // 148,069 to 151,086 pixels, 150,631 on average. This comment used to call
  // it 3,000, which is fiftyfold out and was the one number in this block
  // that did not reproduce.
  // Below 0.14 the wash stops being visible: over paper (250,248,244) the
  // accent's (176,67,12) moves the blue channel 232 at full strength, so 0.14
  // moves it 32.5 and the board renders (239,222,211) — 33 off on blue, and
  // that exact triple is what 147,533 to 150,870 of those pixels come out as,
  // 99.64% to 99.86% of the set in every one of the twelve seeds. Above
  // it the walls start to go: a wall stroke is INK at 0.9, and renders
  // (49,49,48) on paper, 12.277:1; washed at 0.14 it renders (67,51,43)
  // against washed paper, still 9.192:1. Half the blue is back by the frame at
  // 65ms and the board is exactly (250,248,244) again by the frame at 182ms,
  // inside the 200ms the falloff nominally runs for and before the runner has
  // crossed 1.1 cells at SPEED 5.5.
  // Drawn under the tether, arrow and runner on purpose: the accent is the
  // runner's own hue, and a wash laid over the two amber marks would tint them
  // towards the paper they are meant to stand out from. Under them, they are
  // untouched — the board moves and the marks do not.
  // reduceMotion does not fork here, and that is derived rather than asserted.
  // Rate: a clear cannot come faster than MIN_MAZE_SECONDS = (COLS-1)/SPEED =
  // 2.1818s apart, so the wash tops out at 0.458 Hz — an order of magnitude
  // under the 3 Hz general-flash threshold, and that is the ceiling, not an
  // average. Depth: the step is (250,248,244) -> (239,222,211), L* 97.63 ->
  // 89.53, delta-L* 8.1 over 200ms. A colour that fades by eight L* points at
  // half a hertz is not motion; the only thing on this canvas that is, and the
  // only thing that forks, is the exit ring's breath, which is a moving edge.
  var FLASH_MS = 200, FLASH_ALPHA = 0.14;
  function drawFlash(now) {
    var e = now - G.flashAt;
    if (e >= FLASH_MS) return;
    // onCleared reads the clock after this frame's rAF timestamp was taken, so
    // the clearing frame itself arrives here with a slightly negative age. It
    // is the frame the player sees the new maze on, and it gets full strength.
    if (e < 0) e = 0;
    var k = 1 - e / FLASH_MS;
    ctx.globalAlpha = FLASH_ALPHA * k * k;
    ctx.fillStyle = ACCENT;
    ctx.fillRect(0, 0, boardPx(), boardPx());
    ctx.globalAlpha = 1;             // drawTrail inherits whatever is left here
  }

  // Paper mixed towards ink by f. Opaque on purpose — see drawTrail.
  function graphite(f) {
    return 'rgb(' + Math.round(250 - 223 * f) + ',' +
                    Math.round(248 - 221 * f) + ',' +
                    Math.round(244 - 217 * f) + ')';
  }

  // The trail is what makes a wrong turn legible, so it is not decoration.
  // Two things it must not do. It must not be amber: the accent belongs to
  // the runner and its arrow and to nothing else, so amber on the board always
  // means "you, and the choice in front of you" — a trail in the same hue only
  // louder was why the arrow read as a darker patch of trail. And it must not
  // stack: the fade lives in the colour, not in globalAlpha, so where the path
  // crosses itself the newer segment simply covers the older one instead of
  // compositing into a dark blot the arrow can no longer be told apart from.
  // Opaque segments also mean no beads at the round joins, instead of the
  // O(n^2) layered version this replaces.
  // The ramp runs from TRAIL_FAINT up to TRAIL_INK rather than up from nothing.
  // The alternative is a ramp from 0 to TRAIL_INK, and it spends its faint end
  // below reading: band centres there start at f 0.021, so three of the twelve
  // bands — the oldest nine of the thirty-nine segments — come out at 1.05:1,
  // 1.13:1 and 1.23:1, under 1.25:1 and not information whatever TRAIL_MAX
  // says. Name the ramp when you quote these: counting the same bands over
  // 0 to 0.26 instead gives five bands and sixteen segments, and an earlier
  // version of this comment that left the ramp implicit was derived both ways
  // and was wrong both times.
  // These two are the ends of the ramp, not colours anything is ever drawn in:
  // drawTrail quantises into bands and strokes each band at its *centre*, so
  // the darkest band on screen is f 0.49 and the faintest is f 0.27. The
  // contrasts below are the ones a player actually sees, measured on rendered
  // pixels; the literals themselves would be 3.25:1 and 1.73:1.
  var TRAIL_INK = 0.50;                         // newest band drawn, f 0.49: 3.17:1 on paper
  var TRAIL_FAINT = 0.26;                       // oldest band drawn, f 0.27: 1.79:1 on paper
  var TRAIL_BANDS = 12;                         // colour steps; see the batching note
  function drawTrail() {
    var pts = [];
    for (var i = 0; i < G.trail.length; i++) {
      pts.push(centreX(G.trail[i]), centreY(G.trail[i]));
    }
    pts.push(runnerX(), runnerY());
    var n = pts.length / 2;
    if (n < 2) return;
    ctx.lineWidth = Math.max(1, CELL * 0.18);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // Segments are quantised into bands and each band is drawn as one path,
    // oldest first, so a newer segment still covers an older one where the walk
    // crosses itself. Twelve steps is below where the ramp shows banding at
    // these levels, and it is twelve strokes a frame instead of forty.
    var span = TRAIL_INK - TRAIL_FAINT;
    for (var band = 0; band < TRAIL_BANDS; band++) {
      var lo = Math.floor((n - 1) * band / TRAIL_BANDS);
      var hi = Math.floor((n - 1) * (band + 1) / TRAIL_BANDS);
      if (hi <= lo) continue;
      ctx.strokeStyle = graphite(TRAIL_FAINT + span * (band + 0.5) / TRAIL_BANDS);
      ctx.beginPath();
      ctx.moveTo(pts[lo * 2], pts[lo * 2 + 1]);
      for (var k = lo; k < hi; k++) ctx.lineTo(pts[k * 2 + 2], pts[k * 2 + 3]);
      ctx.stroke();
    }
  }

  // The corridor from the runner to the junction the arrow is standing on.
  // Without it the arrow is a mark with walls in between and nothing saying
  // which question it is answering, and the corridor between them is long: over
  // 21,581 sampled frames the path ran to 57 cells at the 99th percentile and
  // 76 at the longest. There are no choices anywhere along this stretch — it is
  // the route the runner takes on its own — so it tells the player nothing they
  // could not already work out.
  function drawTether() {
    var p = G.pending;
    if (!p || !p.path || !p.path.length) return;
    // A junction one cell away needs no tether: there is nothing between the
    // runner and the arrow to be ambiguous about, and a dashed line across
    // that gap is exactly what welded the two amber marks into one glyph with
    // a tail. 17% of sampled frames are at that distance — common, not the
    // majority the 35% this line used to claim would have made it.
    if (p.path.length <= 1) return;
    // 0.45 put the dashes at rgb(217,167,140) = 2.02:1 on paper, which at CELL
    // 25 and below is a rumour rather than a line, and this line is the whole
    // answer to "which junction does that arrow belong to". 0.8 is 3.79:1 and
    // still visibly weaker than the full-strength arrow it points at.
    ctx.strokeStyle = ACCENT;
    ctx.globalAlpha = 0.8;
    ctx.lineWidth = Math.max(1, CELL * 0.07);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.setLineDash([Math.max(2, CELL * 0.13), Math.max(3, CELL * 0.17)]);
    ctx.beginPath();
    ctx.moveTo(runnerX(), runnerY());
    for (var i = 0; i < p.path.length; i++) {
      ctx.lineTo(centreX(p.path[i]), centreY(p.path[i]));
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  // Position and direction carry the meaning; colour is not the only signal.
  // Full strength, never composited down, and laid on its own paper halo the
  // way the runner is — that is what keeps it a separate mark rather than a
  // darker patch of whatever it happens to be standing on.
  //
  // The arrow's whole geometry budget, spent once, so nobody re-derives it.
  // Everything it paints has to stay inside the junction's own half-cell —
  // CELL/2, 22.00px at CELL 44 — or the paper halo is laid across the wall
  // stroke that same cell is drawn with. At CELL 44, from the junction centre:
  //
  //   shaft to the tip     0.38*CELL                     = 16.72
  //   round cap on the halo  (w + halo)/2                =  5.28
  //                          w    = 0.14*CELL = 6.16
  //                          halo = 0.10*CELL = 4.40
  //   painted extent       16.72 + 5.28                  = 22.00  <= 22.00
  //   shaft behind the head  16.72 - 0.19*CELL           =  8.36
  //   head arm               0.19*CELL                   =  8.36
  //
  // It was head 0.22 and halo 0.12, which put the painted extent at 22.44 —
  // already over the half-cell — and left 7.04px of shaft behind a 9.68px arm,
  // which is why the mark read as a chevron rather than an arrow. The shaft is
  // the thing that cannot move: lengthening it drags the halo further across
  // the wall, and moving the tail back behind the centre takes the arrow off
  // the junction it belongs to. So the 1.32px of visible shaft came out of the
  // head and the halo instead, and it buys the overrun back on the way. Equal
  // shaft and arm is the end of this budget, not a step in it.
  //
  // It is exact at every CELL from 25 up, where neither 2.5px minimum binds:
  // 0.38*C + (0.14*C + 0.10*C)/2 = 0.50*C, the half-cell, identically. Below
  // that the two minimums bind one at a time, so there are two regimes and not
  // one. Both, because a single formula here quoted the wrong regime's number
  // underneath itself:
  //
  //   C >= 25            w and halo both scale        overrun 0, exactly
  //   17.857 <= C < 25   halo pinned at 2.5           overrun = 1.25 - 0.05*C
  //                                                   0.36px at C 17.86,
  //                                                   0.05px at C 24
  //   C < 17.857         w pinned at 2.5 as well      overrun = 2.5 - 0.12*C
  //                                                   1.18px at the C 11 floor
  //
  // They meet at C = 17.857, where 0.14*C is 2.5 and both give 0.357. Below
  // there these two constants do nothing at all, and only smaller minimums
  // could move it.
  //
  // Rendered check, since a paper halo on paper leaves nothing to measure:
  // this function run over both geometries on a #7f7f7f field, canvas 600x600
  // at dpr 1, CELL 44, arrow pointing east out of a real junction centre
  // px(6) + CELL/2 = 287. Painted extent read as the far edge of the furthest
  // non-background pixel: 23.0px before, 22.0px after. That convention is the
  // one the 22.00 above is in. Read instead as that pixel's centre it is 22.5
  // before and 21.5 after — half a pixel less, both times, which is how a pair
  // of numbers from one convention each got quoted here once. The analytic
  // pair is 22.44 and 22.00.
  function drawArrow() {
    var p = G.pending;
    if (!p || !p.options.length) return;
    var d = p.options[p.selIndex % p.options.length];
    var x0 = centreX(p.cell), y0 = centreY(p.cell);
    var len = CELL * 0.38;
    var ex = x0 + DX[d] * len, ey = y0 + DY[d] * len;
    var head = CELL * 0.19;                          // 8.36px at CELL 44; see the budget above
    var bx = -DX[d] * head, by = -DY[d] * head;      // back along the shaft
    var nx = -DY[d] * head * 0.72, ny = DX[d] * head * 0.72;
    var w = Math.max(2.5, CELL * 0.14);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x0, y0); ctx.lineTo(ex, ey);
    ctx.moveTo(ex, ey); ctx.lineTo(ex + bx + nx, ey + by + ny);
    ctx.moveTo(ex, ey); ctx.lineTo(ex + bx - nx, ey + by - ny);
    ctx.strokeStyle = PAPER;                          // halo, then the mark
    ctx.lineWidth = w + Math.max(2.5, CELL * 0.10);   // 22.00px painted extent at CELL 44
    ctx.stroke();
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = w;
    ctx.stroke();
  }

  // Stroked first and filled second, so the halo is all *outside* the disc and
  // the runner keeps its full radius. A 1px ring was enough against paper and
  // not enough against a trail the runner is by definition standing on: the
  // ring is what separates the two amber marks when the arrow is next door.
  function drawRunner() {
    var x = runnerX(), y = runnerY(), r = Math.max(2, CELL * 0.2);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.strokeStyle = PAPER;
    ctx.lineWidth = Math.max(2, CELL * 0.11);
    ctx.stroke();
    ctx.fillStyle = ACCENT;
    ctx.fill();
  }

  function draw(now) {
    var size = boardPx();
    ctx.clearRect(0, 0, size, size);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, size, size);
    drawTrail();
    drawWalls();
    drawExit(now);
    drawFlash(now);
    if (G.state === 'running') { drawTether(); drawArrow(); }
    drawRunner();
  }

  // ---- HUD, overlay and announcements --------------------------------
  function nowMs() {
    return (window.performance && performance.now) ? performance.now() : Date.now();
  }

  function announce(msg) { liveEl.textContent = msg; }

  // Clearing a maze is the only reward the game has, and the board is replaced
  // in the same frame, so the count itself has to acknowledge it. One beat of
  // accent on the number, in place — no transition, nothing on the board.
  var bumpTimer = 0;
  function bumpCleared() {
    syncHud(nowMs(), true);          // the beat has to land on the new number
    clearedEl.classList.add('bump');
    if (bumpTimer) clearTimeout(bumpTimer);
    bumpTimer = setTimeout(function () { clearedEl.classList.remove('bump'); }, 520);
  }

  // ---- records -------------------------------------------------------
  var KEY = 'maze-dash.best.v1';

  function emptyBest() { return { cleared: 0, fastest: null }; }

  // The floor under any honest "fastest maze". The exit is always in the last
  // column and the runner always starts in the first, so it covers at least
  // COLS - 1 cells at SPEED cells per second, and mazeElapsed is charged the
  // whole frame that lands the clear. 12 / 5.5 = 2.18s: nothing under that was
  // played, whatever the stored blob says.
  var MIN_MAZE_SECONDS = (COLS - 1) / SPEED;

  // Type first, then range. Number() is not a validator — it coerces the type
  // away: "1e3" came back as 1000 mazes, true as one maze in 1.00s, [4] as
  // four. The bounds stay as wide as they already were; it is the typeof that
  // does the work.
  function isCount(x) {
    return typeof x === 'number' && Number.isInteger(x) && x >= 0 && x < 1e6;
  }
  // NaN and Infinity fail both comparisons, so no separate finiteness test.
  function isTime(x) {
    return typeof x === 'number' && x >= MIN_MAZE_SECONDS && x <= 60;
  }

  // Never let a stored value break the page, and never let one lie either: a
  // record that fails any of these tests reads as no record at all, exactly
  // like a missing key. Silently rewriting it into a wrong-but-plausible
  // number is worse than admitting there is nothing to show.
  function loadBest() {
    try {
      var raw = localStorage.getItem(KEY);          // can throw: private mode
      if (!raw) return emptyBest();
      var o = JSON.parse(raw);                      // can throw: any garbage
      if (!o || typeof o !== 'object') return emptyBest();
      var c = o.cleared, f = (o.fastest === undefined) ? null : o.fastest;
      if (!isCount(c)) return emptyBest();
      if (f !== null && !isTime(f)) return emptyBest();
      // A record is one fact, not two independently sanitised ones: you cannot
      // clear mazes without a fastest maze, or have a fastest maze without
      // clearing one. Sanitising the fields apart is what printed the
      // self-contradictory "best 0 mazes · fastest 60.00s".
      if ((c > 0) !== (f !== null)) return emptyBest();
      return { cleared: c, fastest: f };
    } catch (e) { return emptyBest(); }
  }

  function saveBest(b) {
    try { localStorage.setItem(KEY, JSON.stringify({ v: 1, cleared: b.cleared, fastest: b.fastest })); }
    catch (e) { /* quota or disabled storage: records just don't persist */ }
  }

  var best = loadBest();

  function recordText() {
    if (!best.cleared && best.fastest === null) return '';
    var s = 'best ' + best.cleared + (best.cleared === 1 ? ' maze' : ' mazes');
    if (best.fastest !== null) s += ' · fastest ' + best.fastest.toFixed(2) + 's';
    return s;
  }

  // The record line is the all-time number, and it stands down on exactly one
  // screen: the results of a run that beat *both* halves of it. There the
  // overlay already prints this run's count and its fastest maze, and those
  // two numbers are now the record, so #best would be the same pair again.
  //
  // It used to stand down whenever *either* half moved, and that was wrong in
  // the two cases where the halves disagree, which are the cases the headline
  // exists to tell apart. Beat the count only, and the record's fastest maze
  // is a better time than this run's — blanking it left this run's slower
  // time alone on the page in the position the record used to occupy. Beat
  // the fastest maze only, and the record's count is higher than this run's —
  // blanking it hid the very number the headline had just said was not
  // beaten. Both times the screen deleted the record it was talking about.
  function syncBestLine(suppress) { bestEl.textContent = suppress ? '' : recordText(); }

  // Records are written once, at the end of a run — not per maze. A run that
  // beats nothing still rewrites the key, so a corrupt value gets replaced.
  //
  // `best` is a snapshot taken at boot, and two tabs share one key: writing the
  // snapshot back whole is how a tab that booted at 7 mazes erased another
  // tab's 99. So the stored record is re-read here and merged in before the run
  // is judged against it, and each field only ever moves the good way. A stored
  // blob that fails validation reads as no record, exactly as it does at boot,
  // and is overwritten. This is a merge on write and nothing more: a tab still
  // shows the record it booted with until its own run ends.
  function onRunEnd() {
    var stored = loadBest();
    if (stored.cleared > best.cleared) best.cleared = stored.cleared;
    if (stored.fastest !== null && (best.fastest === null || stored.fastest < best.fastest)) {
      best.fastest = stored.fastest;
    }
    // Two records, tracked apart, because the results screen has to say which
    // one moved: a single boolean is what let a one-maze run against a
    // standing best of nine mazes announce "new best".
    var beat = { count: false, fast: false };
    if (G.cleared > best.cleared) { best.cleared = G.cleared; beat.count = true; }
    if (G.fastestThisRun !== null && (best.fastest === null || G.fastestThisRun < best.fastest)) {
      best.fastest = G.fastestThisRun;
      beat.fast = true;
    }
    saveBest(best);
    syncBestLine(beat.count && beat.fast);   // only a both-halves run repeats itself; see syncBestLine
    return beat;
  }

  function setOverlay(parts) {
    while (overlay.firstChild) overlay.removeChild(overlay.firstChild);
    for (var i = 0; i < parts.length; i++) {
      if (!parts[i].text) continue;
      var d = document.createElement('div');
      d.className = parts[i].cls;
      d.textContent = parts[i].text;
      overlay.appendChild(d);
    }
    overlay.removeAttribute('hidden');
  }

  // #hud is never a live region — updating it per frame would flood a screen
  // reader — so it is throttled to ~10 Hz and only written when it changes.
  var lastHudAt = -1e9, lastTimeStr = '', lastClearedStr = '';
  function syncHud(now, force) {
    if (!force && now - lastHudAt < 100) return;
    lastHudAt = now;
    var t = (G.timeLeft > 0 ? G.timeLeft : 0).toFixed(1);
    if (t !== lastTimeStr) { lastTimeStr = t; timeEl.textContent = t; }
    var c = String(G.cleared);
    if (c !== lastClearedStr) { lastClearedStr = c; clearedEl.textContent = c; }
  }

  // Each screen says its own thing once. The title is in the h1, the record is
  // in #best, the score is in #hud, and the hint under the button says what
  // the button will actually do — on all three screens, this one included,
  // which is why this card no longer says it too. What is left here is the
  // one fact no other surface carries: the arrow is not on the runner, it is
  // on a junction the runner has not reached yet (a median 5 cells off).
  //
  // The rule gets a card of its own rather than a clause bolted to the
  // sentence above it. Cards cost no board pixels — #overlay is absolutely
  // positioned and never feeds hintPx(). Measured, not assumed, and the
  // pairs are named so the next shift can re-run it: widths {1280, 900, 740,
  // 480, 412, 390, 360, 320, 280, 180} x heights 320 to 1000 step 20, 350
  // pairs, in the ready state and again after Start, one cold page load per
  // pair, this build against the same build with this card deleted. CELL
  // differs at 0 of 700 comparisons. The control that makes that non-vacuous
  // is the same sweep with this same string appended to #hint instead, where
  // CELL drops at 99 of 350 pairs in each state.
  //
  // Card length is not free of *everything*, though: #overlay centres its
  // content, so a stack taller than the board hangs off both ends and the
  // bottom half lengthens the page. Held under 805f36c's own worst-case
  // page overflow at every viewport, which at 320x320 leaves this pair of
  // cards a 404.59px content budget and 47px of slack, and at 180x320 a
  // 436.59px budget and 79px. Lengthening either card is a layout change
  // too, just a different one from lengthening the hint.
  function showTitle() {
    setOverlay([
      { cls: 'sub', text: 'The runner never stops. The arrow is on the junction ahead.' },
      { cls: 'sub', text: RULE }
    ]);
    actBtn.textContent = 'Start run';
  }

  // ---- run loop ------------------------------------------------------
  function startRun() {
    G.state = 'running';
    G.timeLeft = 60;
    G.cleared = 0;
    G.mazeElapsed = 0;
    G.fastestThisRun = null;
    G.flashAt = -1e9;
    newMaze();
    resetRunner();
    syncBestLine(false);
    overlay.setAttribute('hidden', '');
    actBtn.textContent = 'Turn';
    announce('Run started.');
    syncHud(nowMs(), true);
  }

  function endRun() {
    G.state = 'over';
    G.timeLeft = 0;
    G.overAt = nowMs();
    var fast = G.fastestThisRun;
    var beat = onRunEnd();
    var beaten = beat.count || beat.fast;
    // The headline names the record, because "new best" did not. Mazes cleared
    // is the score and the fastest maze is a separate record, and the fastest
    // one moves on runs that are nowhere near the score: the line has to say
    // which. The number itself is already on the page either way — the count
    // in the HUD, the time in the card below this one.
    //
    // Three words is one too many at phone width. `.big` is 1.35rem at 0.14em
    // letterspacing, and the overlay column is clamped to 217px at a 280px
    // viewport, so `most mazes yet` and `fastest maze yet` each came out
    // 62px — two lines, with `yet` stranded alone on the second. Measured on
    // the rendered card at 280/320/390/1280, one line is 37px, and of the
    // eleven phrasings tried only those two wrap, and only at 280: `time up`,
    // `best run yet`, `most mazes`, `fastest maze`, `best run`, `most yet`,
    // `fastest yet`, `best yet` and `new record` are all 37px at all four
    // widths. So the two that wrap lose their `yet` and the one that fits
    // keeps it. What says "record" is the accent (`big new`), not the word;
    // the announcement below still says the whole thing.
    var headline = beaten
      ? (beat.count && beat.fast ? 'best run yet' : beat.count ? 'most mazes' : 'fastest maze')
      : 'time up';
    // The card under the headline reports *this run*, and it is written to
    // continue the headline rather than restate it. "fastest maze yet" over
    // "fastest maze 5.00s" said the same two words twice and read as a
    // stutter; "fastest maze" over "in 5.00s" is one sentence. And when
    // the count is the news, the count has to be on the card: a card whose
    // only number was the fastest maze put the wrong record under the
    // headline. The standing record is on #best in both of those cases now.
    var mazes = G.cleared + (G.cleared === 1 ? ' maze' : ' mazes');
    var sub;
    if (fast === null) sub = 'No maze cleared this run.';
    else if (beat.count) sub = mazes + ', fastest ' + fast.toFixed(2) + 's';
    else if (beat.fast) sub = 'in ' + fast.toFixed(2) + 's';
    else sub = 'fastest maze ' + fast.toFixed(2) + 's';
    setOverlay([
      { cls: beaten ? 'big new' : 'big', text: headline },
      { cls: 'sub', text: sub },
      { cls: 'sub', text: RULE }
    ]);
    actBtn.textContent = 'Run again';
    announce('Time up. ' + G.cleared + (G.cleared === 1 ? ' maze' : ' mazes') + ' cleared.' +
      (fast === null ? '' : ' Fastest maze ' + fast.toFixed(1) + ' seconds.') +
      (!beaten ? '' : beat.count && beat.fast ? ' Best run yet: most mazes cleared and fastest maze.'
        : beat.count ? ' Most mazes cleared yet.' : ' Fastest maze yet.'));
    syncHud(nowMs(), true);
  }

  function update(dt) {
    // The last frame of a run is only as long as the clock has left. Charging
    // a whole frame regardless is how a maze cleared on that frame could be
    // recorded at 60.02s — an in-session "fastest" that loadBest() then threw
    // away on the next reload for being over 60.
    if (dt > G.timeLeft) dt = G.timeLeft;
    // Order is fixed: movement and clears are processed first, then the clock
    // is applied and tested, so a maze finished on the final frame counts.
    G.mazeElapsed += dt;
    stepRunner(dt);
    G.timeLeft -= dt;
    if (G.timeLeft <= 0) endRun();
  }

  // ---- input ---------------------------------------------------------
  // One action, three bindings. A press with no pending junction is a no-op:
  // it is not queued and not applied to a later junction.
  // How long the results screen is protected from the press you were already
  // making. It is a constant, not a mechanic: presses inside it are dropped,
  // never queued, so the run that starts is one you asked for after reading
  // the score. 350ms was too short to be that — measured on the shipped build
  // with a fake clock stepped at 16.667ms, a single press was ignored at 300ms
  // and accepted at 340ms, and mashing the button at an ordinary 450ms cadence
  // through the buzzer restarted the run on the first press after it, 450ms in,
  // with 300ms and 600ms cadences landing at 600ms. That is under the time it
  // takes to read a two-line results card. At 1000ms the same mash lands on the
  // third press at 1350ms (450ms cadence), the fourth at 1200ms (300ms), the
  // second at 1200ms (600ms), and the worst case over any cadence is the
  // constant itself: the score is on screen for at least a second. Re-measured
  // on this value the same way, a single press is ignored at a nominal 950ms
  // and accepted at 990ms — a press lands on the next frame boundary, so the
  // real edge is the constant and the 40ms of slop is the frame step.
  var RESTART_GUARD_MS = 1000;

  function press() {
    if (G.state === 'ready') { startRun(); return; }
    if (G.state === 'over') {
      if (nowMs() - G.overAt >= RESTART_GUARD_MS) startRun();
      return;
    }
    var p = G.pending;
    if (!p || !p.options.length) return;
    p.selIndex = (p.selIndex + 1) % p.options.length;
  }

  window.addEventListener('keydown', function (e) {
    if (e.key !== ' ' && e.key !== 'Enter') return;
    if (e.repeat) return;                            // holding does not spin it
    if (e.key === ' ') e.preventDefault();           // never scroll the page
    press();
  });

  function onPointerDown(e) {
    if (e.isPrimary === false) return;               // a second finger is not a second press
    // preventDefault stops the tap selecting text or double-tap-zooming, but
    // it also cancels the focus the button would have taken for itself, which
    // left document.activeElement on BODY after every mouse click. Restore it.
    e.preventDefault();
    if (e.currentTarget === actBtn) { try { actBtn.focus(); } catch (err) { /* no-op */ } }
    press();
  }
  canvas.addEventListener('pointerdown', onPointerDown);
  overlay.addEventListener('pointerdown', onPointerDown);
  actBtn.addEventListener('pointerdown', onPointerDown);

  // ---- frame loop ----------------------------------------------------
  var last = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    layoutIfNeeded();
    var dt = (now - last) / 1000;
    last = now;
    if (!(dt > 0)) dt = 0;
    // Mandatory: a backgrounded tab or a stalled main thread otherwise
    // delivers a multi-second delta that walks the runner through walls.
    dt = Math.min(dt, 0.05);
    if (G.state === 'running') update(dt);
    draw(now);
    syncHud(now, false);
  }

  newMaze();
  resetRunner();
  syncBestLine(false);
  // The markup carries this sentence too, so the pre-script paint is not
  // blank; writing it once from the constant is what keeps the two the same.
  hintEl.textContent = HINT;
  showTitle();
  layoutIfNeeded();
  requestAnimationFrame(frame);
})();
} catch (err) {
  // Every affordance on the page is now a lie: there is no run to start, no
  // clock counting and no turn to change. Take them away rather than leave a
  // Start button that does nothing.
  //
  // The order of these steps is load-bearing and must not be shuffled. The
  // ones that take affordances away run first and the one that reveals the
  // overlay runs last, so a recovery that is itself half-broken stops at an
  // inert page rather than at a playable-looking one. The sentence is written
  // into the overlay before the overlay is shown, for the same reason: an
  // empty card, or the title copy the last successful statement left there,
  // is not a failure message.
  bootStep(function () { bootAct.hidden = true; });
  bootStep(function () { bootHud.hidden = true; });
  bootStep(function () { bootHint.textContent = 'Try reloading the page.'; });
  if (bootStep(function () { bootOverlay.textContent = 'Something went wrong loading the game.'; })) {
    bootStep(function () { bootOverlay.removeAttribute('hidden'); });
  }
  if (window.console && console.error) console.error(err);
}
</script>
</body>
</html>
